{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="card" style="max-width:460px;margin:0 auto">
  <h3>Change password</h3>
  <p class="muted" style="margin-bottom:16px">Use at least 8 characters. Do not share your password.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="current">Current password</label><input id="current" type="password" name="current" required></div>
    <div class="field"><label for="new">New password</label><input id="new" type="password" name="new" minlength="8" required></div>
    <div class="field"><label for="confirm">Confirm new password</label><input id="confirm" type="password" name="confirm" minlength="8" required></div>
    <button class="btn btn-blue btn-block" type="submit">Save new password</button>
  </form>
</div>
{% endblock %}
