{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:40px auto;text-align:center">
  <h1 style="font-size:48px;color:#94a3b8">{{ code }}</h1>
  <h2>{{ title }}</h2>
  <p class="muted" style="margin:10px 0 20px">{{ message }}</p>
  <a class="btn btn-blue" href="{{ url_for('auth.login') }}">Go to home</a>
</div>
{% endblock %}
